name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate skill and templates
        run: python3 skills/layered-orchestration/scripts/validate.py --repo .
      - name: Run validator mutation tests
        run: python3 -m unittest discover -s tests -v
      - name: Check skill discovery
        run: npx -y skills@1.5.23 add . --list
